name: Build Custom IPTV Playlist
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    paths: ['config.json', 'build_m3u.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python build_m3u.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u sn.m3u africa.m3u islam.m3u sport.m3u soccer.m3u lite.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlists" && git push)
